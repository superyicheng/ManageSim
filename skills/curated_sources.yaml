    description: "Dev workflow skills for Claude"
    category: development
    skills:
      - id: superpowers-code-review
        name: "Code Review"
        description: "Comprehensive code review with security and performance analysis"
        tags: [code-review, security, performance]
      - id: superpowers-git-ops
        name: "Git Operations"
        description: "Advanced git workflow management"
        tags: [git, workflow, automation]
      - id: superpowers-testing
        name: "Test Generation"
        description: "Auto-generate test cases from code"
