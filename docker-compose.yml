version: "3.8"

services:
  gateway:
    build: ./gateway
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      - asset-base
    restart: unless-stopped

  asset-base:
    build: ./asset_base
    env_file: .env
    ports:
      - "8100:8100"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped

  knowledge:
    build: ./knowledge
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    restart: unless-stopped

  evolution:
    build: ./evolution
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      - asset-base
      - knowledge
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    depends_on:
      - asset-base
      - knowledge
    restart: unless-stopped
